name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs: {}

jobs:
  cicd:
    uses: ckoliber/.github/.github/workflows/cicd.yml@main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.14

      - run: mise run test
      - if: github.event_name == 'push'
        run: mise run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
